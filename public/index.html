<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jogo do Infiltrado</title>
<meta name="theme-color" content="#2a0f3c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,800&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="net" class="net hide">Reconectando…</div>
<div id="app"></div>
<button id="chatBtn" class="chatbtn hide" aria-label="Abrir chat">💬<span id="badge" class="badge hide"></span></button>
<aside id="chat" class="chat hide">
  <header><b>Chat da sala</b><button id="chatX" aria-label="Fechar chat">✕</button></header>
  <div id="msgs"></div>
  <form id="cform"><input id="cin" maxlength="200" placeholder="Mensagem (sem dizer a palavra!)" autocomplete="off"><button>➤</button></form>
</aside>
<div id="toast" class="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
